name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: linter selftest
        run: python3 tools/lint.py --selftest

      - name: ast selftest
        run: python3 tools/ast_check.py --selftest

      - name: changelog extractor selftest
        run: python3 tools/changelog_section.py --selftest

      # release.yml builds the notes from the section matching the tag, and it
      # fails after the tag is already pushed. v0.4.0 through v0.4.2 each shipped
      # a version bump with no section and left a tag with no release.
      - name: Codex and Claude manifests agree on the version
        run: |
          python3 - <<'EOF'
          import json
          v = [json.load(open(p))['version'] for p in ('.claude-plugin/plugin.json', '.codex-plugin/plugin.json')]
          assert v[0] == v[1], f'.claude-plugin is {v[0]}, .codex-plugin is {v[1]}'
          EOF

      - name: changelog covers the plugin version
        run: |
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          python3 tools/changelog_section.py "$v" > /dev/null || {
            echo "docs/CHANGELOG.md has no '## [$v]' section; write it before you tag v$v"
            exit 1
          }

      - name: install tree-sitter for the JS ast check
        run: pip install tree-sitter tree-sitter-language-pack

      # With tree-sitter present, ast_check parses the hooks JavaScript too.
      - name: ast check own source
        run: python3 tools/ast_check.py --check hooks/ tools/

      - name: lint own docs
        run: python3 tools/lint.py --check README.md docs/CONTRIBUTING.md docs/CHANGELOG.md docs/hooks.md docs/linting.md

      # The standalone linter allows a couple of em-dashes per line. This repo's
      # own docs hold to zero, since the plugin exists to discourage them.
      - name: no em-dashes in our own docs
        run: |
          if grep -rn "—" README.md docs/; then
            echo "em-dash found above; use a colon, comma, or a second sentence"; exit 1
          fi

      - name: lint own comments
        run: python3 tools/lint.py --check --code tools/ hooks/ install.sh

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: hook selftest
        run: node hooks/selftest.js
